version: '3.8'

services:
  app:
    image: ${DOCKER_IMAGE:-ghcr.io/zdrepository/ci-cd-demo}:${IMAGE_TAG:-latest}
    container_name: ci_cd_demo
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
